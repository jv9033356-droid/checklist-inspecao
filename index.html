<!doctype html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist MVP</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="h-full bg-[#0f172a] text-white">

    <div id="app" class="h-full flex flex-col"> 
        <header class="p-4 bg-[#1e293b] border-b border-[#334155] flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-amber-500 flex items-center justify-center">
                    <i data-lucide="clipboard-check" class="text-slate-900"></i>
                </div>
                <h1 class="text-lg font-bold text-slate-100">Inspeção Predial</h1>
            </div>
            <div id="progresso-texto" class="text-amber-500 font-bold text-sm">0%</div>
        </header>

        <main class="flex-1 overflow-y-auto p-4">
            <section id="screen-start" class="fade-in">
                <div class="bg-[#1e293b] p-6 rounded-2xl border border-[#334155]">
                    <h2 class="text-xl font-bold mb-4">Nova Inspeção</h2>
                    <label class="block text-xs text-slate-400 mb-1">Responsável</label>
                    
                    <input id="input-responsible" type="text" placeholder="Seu nome" 
                           class="w-full bg-[#0f172a] border border-[#334155] p-3 rounded-xl mb-4 outline-none focus:border-amber-500 transition-colors"
                           onblur="respostas['responsavel'] = this.value; enviarParaGoogleSheets('responsavel')">
                    
                    <button id="btn-iniciar" class="w-full bg-amber-500 text-slate-900 font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 active:scale-95 transition-transform">
                        <i data-lucide="play"></i> Iniciar
                    </button>
                </div>
            </section>

            <section id="screen-categories" class="hidden fade-in">
                <div id="categories-grid" class="space-y-3"></div>
            </section>

            <section id="screen-items" class="hidden fade-in">
                <button id="btn-voltar" class="text-amber-500 flex items-center gap-2 mb-4 font-bold text-sm">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> Voltar Categorias
                </button>
                <h2 id="titulo-categoria" class="text-xl font-bold mb-4 text-slate-100"></h2>
                <div id="lista-itens" class="space-y-4 pb-10"></div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
